<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RANK & SCORE</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./style.css" />
  
  <style>
    /* ================= 스타일 정의 ================= */
    .glory-table { display:grid; gap:8px; margin-top:10px; }
    
    /* 랭킹 박스 (클릭 가능하도록 커서 변경) */
    .glory-row {
      display: grid;
      grid-template-columns: 50px 1fr 120px;
      align-items: center;
      padding: 14px 16px;
      background: linear-gradient(to bottom, rgba(255,255,255,.04), rgba(255,255,255,.01));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      cursor: pointer; /* 클릭 가능 표시 */
      transition: background 0.2s;
    }
    .glory-row:active { transform: scale(0.98); } /* 클릭 시 살짝 눌림 */
    
    .rank-1 { border-color: rgba(250,204,21,.6); box-shadow: inset 0 0 20px rgba(250,204,21,.1); }
    .rank-2 { border-color: rgba(192,192,192,.5); }
    .rank-3 { border-color: rgba(205,127,50,.5); }
    
    .rank-num { font-weight:900; font-size:16px; color:var(--muted); text-align:center;}
    .rank-1 .rank-num { color: var(--yellow); font-size:20px; }
    
    .guild-name { font-weight:700; font-size:14px; color:#fff; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    
    .guild-score { text-align:right; font-weight:800; font-size:16px; color:var(--good); font-family:monospace; }
    .rank-1 .guild-score { color: var(--yellow); }

    .update-time { text-align:center; color:var(--muted2); font-size:12px; margin-top:20px; }

    /* [NEW] 히스토리 로그 스타일 */
    .history-box {
        display: none; /* 기본 숨김 */
        background: rgba(0,0,0,0.5);
        border: 1px dashed rgba(255,255,255,0.1);
        border-top: none;
        border-radius: 0 0 16px 16px;
        margin-top: -10px; /* 위쪽 박스와 연결 */
        margin-bottom: 10px;
        padding: 20px 20px 10px 20px;
        font-size: 12px;
        color: var(--muted);
    }
    .history-box.show { display: block; animation: fadeIn 0.3s; }
    
    .history-row {
        display: flex; justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .history-row:last-child { border-bottom: none; }
    .history-score { color: #fff; font-family: monospace; font-weight: bold; }
    
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }

    /* 잠금 화면 및 기타 스타일 */
    #locked-screen {
        position: fixed; top:0; left:0; width:100%; height:100%;
        background: #000; z-index: 9999; display: flex;
        align-items: center; justify-content: center; flex-direction: column;
        color: #fff;
    }
    .hidden { display: none !important; }
    .pw-input {
        padding: 10px; border-radius: 8px; border: 1px solid #555;
        background: #222; color: #fff; margin-bottom: 10px; width: 200px; text-align: center;
    }
    .pw-btn {
        padding: 10px 20px; border-radius: 8px; border: none;
        background: var(--yellow); color: #000; font-weight: bold; cursor: pointer;
    }
  </style>
</head>

<body class="home-page">

  <div id="locked-screen">
      <h2 style="color:var(--yellow); margin-bottom:10px;">🔒 보안 접속</h2>
      <p style="color:var(--muted); font-size:13px; margin-bottom:20px;">관리자 비밀번호를 입력하세요.</p>
      
      <input type="password" id="pw-input" class="pw-input" placeholder="Password" onkeyup="if(window.event.keyCode==13){checkPassword()}">
      <button class="pw-btn" onclick="checkPassword()">확인</button>
      
      <button class="btn ghost" onclick="location.href='./index.html'" style="margin-top:20px; border:none;">← 메인으로 돌아가기</button>
  </div>

  <div class="home-wrap" id="main-content" style="display:none;">
    
    <div class="row actions" style="margin-bottom:20px;">
        <a href="./index.html" class="btn ghost">← 뒤로가기</a>
        <div class="status-badge is-live">LIVE TRACKING</div>
    </div>

    <div class="banner-main-wrap" style="padding:20px; text-align:center;">
        <h1 style="color:var(--yellow); margin-bottom:4px;">🏆 실시간 점수 현황판</h1>
        <p class="sub"> 48시간 이내 점수에 변동이 발생할 경우 [비정상 감지⚠️]가 표기 됩니다. </p>
    </div>

    <div id="leaderboard" class="glory-table">
        <div class="result" style="text-align:center;">데이터를 불러오는 중...</div>
    </div>

    <div class="update-time">
        마지막 업데이트: <span id="last-update">-</span>
    </div>

  </div>

  <script>
    const ENCRYPTED_PW = "ISFURUFTVEFSPz8="; 

    function checkPassword() {
        const input = document.getElementById('pw-input').value;
        if (btoa(input) === ENCRYPTED_PW) {
            document.getElementById('locked-screen').classList.add('hidden');
            document.getElementById('main-content').style.display = 'block';
            loadData(); 
            setInterval(loadData, 30000); 
        } else {
            alert("비밀번호가 틀렸습니다.");
            document.getElementById('pw-input').value = "";
            document.getElementById('pw-input').focus();
        }
    }

    async function loadData() {
        try {
            const response = await fetch('./data.json?t=' + new Date().getTime()); 
            const data = await response.json();
            renderTable(data);
        } catch (error) {
            console.error(error);
            document.getElementById('leaderboard').innerHTML = 
                `<div class="result" style="color:var(--red); text-align:center;">
                    데이터 로드 실패
                 </div>`;
        }
    }

    function renderTable(data) {
        const board = document.getElementById('leaderboard');
        let html = '';
        
        if (Object.keys(data).length === 0) {
            board.innerHTML = '<div class="result" style="text-align:center;">수집된 데이터가 없습니다.</div>';
            return;
        }

        const sortedKeys = Object.keys(data).sort((a,b) => parseInt(a) - parseInt(b));
        const now = new Date(); 

        sortedKeys.forEach(rank => {
            const item = data[rank];
            const rankClass = rank <= 3 ? `rank-${rank}` : '';
            const scoreStr = item.score.toLocaleString();
            
            let timeStr = '-';
            let timeStyle = 'color:var(--muted2);'; 

            if (item.time) {
                timeStr = item.time;
                const updateTime = new Date(item.time.replace(' ', 'T'));
                const diffHours = (now - updateTime) / (1000 * 60 * 60);

                if (diffHours < 2) {
                    timeStyle = 'color:var(--yellow); font-weight:700; text-shadow:0 0 5px rgba(250,204,21,0.2);';
                }
            }

            // [NEW] 히스토리 HTML 생성
            let historyHtml = '';
            if (item.history && item.history.length > 0) {
                item.history.forEach(log => {
                    historyHtml += `
                        <div class="history-row">
                            <span>${log.time}</span>
                            <span class="history-score">${log.score.toLocaleString()}</span>
                        </div>
                    `;
                });
            } else {
                historyHtml = `<div class="history-row" style="justify-content:center; color:#555;">이전 기록 없음</div>`;
            }

            // 메인 행 + 히스토리 박스 조합
            html += `
            <div onclick="toggleHistory(this)">
                <div class="glory-row ${rankClass}">
                    <div class="rank-num">#${rank}</div>
                    <div style="display:flex; flex-direction:column; justify-content:center; padding-left:10px;">
                        <div class="guild-name" style="padding-left:0;">${item.name}</div>
                        <div style="font-size:11px; margin-top:2px; letter-spacing:-0.5px; ${timeStyle}">
                            🕒 ${timeStr}
                        </div>
                    </div>
                    <div class="guild-score">${scoreStr}</div>
                </div>
                <div class="history-box">
                    <div style="margin-bottom:5px; font-weight:bold; color:var(--yellow);">📜 Score Logs (Max 10)</div>
                    ${historyHtml}
                </div>
            </div>
            `;
        });

        board.innerHTML = html;
        document.getElementById('last-update').innerText = now.toLocaleString(); 
    }

    // [NEW] 클릭 시 히스토리 토글 함수
    function toggleHistory(element) {
        // 클릭한 요소 내부의 .history-box를 찾음
        const historyBox = element.querySelector('.history-box');
        if (historyBox) {
            historyBox.classList.toggle('show');
        }
    }
  </script>
</body>
</html>
